<!doctype html>
<html lang="es">
  <head>
    <script>
      // Parche de compatibilidad para entornos donde window.fetch tiene únicamente getter
      // Evita el error 'TypeError: Cannot set property fetch of #<Window> which has only a getter'
      (function () {
        try {
          var _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function () {
              return _fetch;
            },
            set: function (newFetch) {
              _fetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });

          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function () {
                  return _fetch;
                },
                set: function (newFetch) {
                  _fetch = newFetch;
                },
                configurable: true,
                enumerable: true,
              });
            } catch (e) {}
          }
        } catch (e) {
          console.warn('[Llegué Bien] No se pudo configurar el descriptor de fetch:', e);
        }
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Llegué Bien</title>

    <meta name="description" content="App para estudiantes que viajan solos: registra tu destino, estima tu hora de llegada, gestiona contactos de emergencia y confirma con un toque cuando llegas a salvo." />

    <meta name="theme-color" content="#0f172a" />
  </head>

  </body>
</html>
